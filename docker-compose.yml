version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shoptaj_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoptaj
      POSTGRES_PASSWORD: shoptaj_pass
      POSTGRES_DB: shoptaj_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shoptaj_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
