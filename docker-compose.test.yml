name: shoptaj-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shoptaj_test
      POSTGRES_PASSWORD: shoptaj_test
      POSTGRES_DB: shoptaj_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shoptaj_test -d shoptaj_test']
      interval: 3s
      timeout: 3s
      retries: 15
    restart: 'no'

  redis-test:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15
    restart: 'no'
