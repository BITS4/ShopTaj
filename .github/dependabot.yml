version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      root-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    groups:
      backend-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - web
    groups:
      web-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: '06:45'
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile
    groups:
      mobile-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Asia/Dushanbe
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
